[package]
name = "skillage"
version = "0.1.0"
description = "Local-first skill and rule management for coding agents"
authors = ["Skillage contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "skillage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
